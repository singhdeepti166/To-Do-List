
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>TaskFlow ✨</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter your task..."
                maxlength="120"
            >
            <button type="submit">Add Task</button>
        </form>

        <div class="task-info">
            <h2>My Tasks</h2>
            <span id="counter">0 tasks left</span>
        </div>

        <div class="filters">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="done">Done</button>
        </div>

        <ul id="task-list"></ul>

        <div class="bottom">
            <span id="total-count">0 tasks</span>
            <button type="button" id="clear-completed">
                Clear Completed
            </button>
        </div>

    </div>

</body>
</html>
